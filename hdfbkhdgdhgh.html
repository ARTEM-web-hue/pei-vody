<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рисовалка</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f9;
    }

    .container {
      text-align: center;
    }

    .color-palette {
      margin-bottom: 10px;
    }

    .color {
      display: inline-block;
      width: 40px;
      height: 40px;
      line-height: 40px;
      text-align: center;
      font-size: 20px;
      cursor: pointer;
      border-radius: 50%;
      margin: 5px;
    }

    .color:hover {
      transform: scale(1.2);
    }

    #canvas {
      border: 2px solid #ccc;
      background-color: white;
    }

    .tools {
      margin-top: 10px;
    }

    .tools button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
    }

    .tools input[type="range"] {
      width: 200px;
      margin: 5px;
    }

    .tools label {
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Панель цветов -->
    <div class="color-palette">
      <span class="color" data-color="red">❤️</span>
      <span class="color" data-color="orange">🧡</span>
      <span class="color" data-color="yellow">💛</span>
      <span class="color" data-color="green">💚</span>
      <span class="color" data-color="blue">💙</span>
      <span class="color" data-color="purple">💜</span>
    </div>

    <!-- Холст -->
    <canvas id="canvas"></canvas>

    <!-- Панель инструментов -->
    <div class="tools">
      <button id="clearButton">Очистить холст</button>
      <label for="brushSize">Размер кисти:</label>
      <input type="range" id="brushSize" min="1" max="50" value="6">
      <button id="circleButton">Круг</button>
      <button id="squareButton">Квадрат</button>
      <div>
        <label for="aiInput">Напишите свой рисунок:</label>
        <input type="text" id="aiInput" placeholder="Опишите рисунок...">
        <button id="aiGenerate">Сгенерировать</button>
      </div>
    </div>
  </div>

  <script>
// Генерация рисунка через getimg.ai
aiGenerate.addEventListener('click', async () => {
  const description = aiInput.value.trim();
  if (!description) {
    alert('Введите описание!');
    return;
  }

  try {
    const imageUrl = await generateImage(description); // Вызов функции генерации

    // Создаем изображение и отображаем его на холсте
    const img = new Image();
    img.src = imageUrl;
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height); // Очистка холста
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height); // Отображение изображения
    };
  } catch (error) {
    alert('Ошибка при генерации изображения: ' + error.message);
  }
});

// Функция для отправки запроса к API getimg.ai
async function generateImage(prompt) {
  const apiKey = 'key-1g3J4a66bacJYjzWoFhkMgUulxyqttEraGUQ2hTSDOKyH0p6sbQBOxkCKQHMZlJQvsFWjUJYx26m2zzIWnecQw6sAamRXfRo'; // ЗАМЕНИТЕ НА ВАШ API-КЛЮЧ
  const url = 'https://api.getimg.ai/v1/image/generate';

  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        prompt: prompt,
        size: '512x512', // Размер изображения
        num_images: 1 // Количество изображений
      })
    });

    if (!response.ok) {
      throw new Error(`Ошибка API: ${response.status}`);
    }

    const data = await response.json();
    if (data && data.images && data.images.length > 0) {
      return data.images[0].url; // URL сгенерированного изображения
    } else {
      throw new Error('Не удалось получить изображение');
    }
  } catch (error) {
    console.error(error);
    throw error; 
  }
}
  </script>
</body>
</html>
