<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рисовалка</title>
  <style>
    /* CSS */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f9;
    }

    .container {
      text-align: center;
    }

    .color-palette {
      margin-bottom: 10px;
    }

    .color {
      display: inline-block;
      width: 40px;
      height: 40px;
      line-height: 40px;
      text-align: center;
      font-size: 20px;
      cursor: pointer;
      border-radius: 50%;
      margin: 5px;
    }

    .color:hover {
      transform: scale(1.2);
    }

    #canvas {
      border: 2px solid #ccc;
      background-color: white;
    }

    .tools {
      margin-top: 10px;
    }

    .tools button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
    }

    .tools input[type="range"] {
      width: 200px;
      margin: 5px;
    }

    .tools label {
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <!-- Yandex.Metrika counter -->
<script type="text/javascript" >

   m[i].l=1*new Date();
   for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
   k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})

<noscript><div><img src="https://mc.yandex.ru/watch/100335233" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
<!-- /Yandex.Metrika counter -->
<div class="container">
    <!-- Панель цветов -->
    <div class="color-palette">
      <span class="color" data-color="red">❤️</span>
      <span class="color" data-color="orange">🧡</span>
      <span class="color" data-color="yellow">💛</span>
      <span class="color" data-color="green">💚</span>
      <span class="color" data-color="blue">💙</span>
      <span class="color" data-color="purple">💜</span>
    </div>

    <!-- Холст -->
    <canvas id="canvas"></canvas>

    <!-- Панель инструментов -->
    <div class="tools">
      <button id="clearButton">Очистить холст</button>
      <label for="brushSize">Размер кисти:</label>
      <input type="range" id="brushSize" min="1" max="50" value="6">
      <button id="circleButton">Круг</button>
      <button id="squareButton">Квадрат</button>
      <div>
        <label for="aiInput">Напишите свой рисунок:</label>
        <input type="text" id="aiInput" placeholder="Опишите рисунок...">
        <button id="aiGenerate">Сгенерировать</button>
      </div>
    </div>
  </div>

  <script>
    // JavaScript
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const colors = document.querySelectorAll('.color');
    const clearButton = document.getElementById('clearButton');
    const brushSizeRange = document.getElementById('brushSize');
    const circleButton = document.getElementById('circleButton');
    const squareButton = document.getElementById('squareButton');
    const aiInput = document.getElementById('aiInput');
    const aiGenerate = document.getElementById('aiGenerate');

    // Настройки холста
    const aspectRatio = 16 / 9; // Соотношение сторон 16:9
    canvas.width = window.innerWidth * 0.8; // Ширина 80% экрана
    canvas.height = canvas.width / aspectRatio; // Высота по соотношению
    let brushColor = 'black'; // Цвет кисти
    let brushSize = 6; // Размер кисти
    let isDrawing = false; // Состояние рисования

    // Установка цвета кисти
    colors.forEach(color => {
      color.addEventListener('click', () => {
        brushColor = color.dataset.color;
      });
    });

    // Обновление размера кисти
    brushSizeRange.addEventListener('input', () => {
      brushSize = parseInt(brushSizeRange.value);
    });

    // Рисование кистью
    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      draw(e);
    });

    canvas.addEventListener('mousemove', (e) => {
      if (isDrawing) {
        draw(e);
      }
    });

    canvas.addEventListener('mouseup', () => {
      isDrawing = false;
    });

    function draw(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      ctx.beginPath();
      ctx.arc(x, y, brushSize, 0, Math.PI * 2); // Круг с заданным размером
      ctx.fillStyle = brushColor;
      ctx.fill();
      ctx.closePath();
    }

    // Очистка холста
    clearButton.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    // Рисование круга
    circleButton.addEventListener('click', () => {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = Math.min(canvas.width, canvas.height) / 4;

      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.fillStyle = brushColor;
      ctx.fill();
      ctx.closePath();
    });

    // Рисование квадрата
    squareButton.addEventListener('click', () => {
      const size = Math.min(canvas.width, canvas.height) / 4;
      const startX = canvas.width / 2 - size / 2;
      const startY = canvas.height / 2 - size / 2;

      ctx.fillStyle = brushColor;
      ctx.fillRect(startX, startY, size, size);
    });

    // Генерация рисунка через getimg.ai
    aiGenerate.addEventListener('click', async () => {
      const description = aiInput.value.trim();
      if (!description) {
        alert('Введите описание!');
        return;
      }

      try {
        const imageUrl = await generateImage(description);

        // Создаем изображение и отображаем его на холсте
        const img = new Image();
        img.src = imageUrl;
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height); // Очистка холста
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height); // Отображение изображения
        };
      } catch (error) {
        alert('Ошибка при генерации изображения: ' + error.message);
      }
    });

    // Функция для отправки запроса к API getimg.ai
    async function generateImage(prompt) {
      const apiKey = 'sk-bagNxClD282D1uAgLQUuxgKkAKNOFQ7OnPg9HMDVEsGJeYRd'; // ЗАМЕНИТЕ НА ВАШ API-КЛЮЧ
      const url = 'https://api.stability.ai/v1/generation/stable-diffusion-xl-1024-v1-0/text-to-image';
      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            prompt: prompt,
            size: '512x512', // Размер изображения
            num_images: 1 // Количество изображений
          })
        });

        if (!response.ok) {
          throw new Error(`Ошибка API: ${response.status}`);
        }

        const data = await response.json();
        if (data && data.images && data.images.length > 0) {
          return data.images[0].url; // URL сгенерированного изображения
        } else {
          throw new Error('Не удалось получить изображение');
        }
      } catch (error) {
        console.error(error);
        throw error;
      }
    }
  </script>
</body>
</html>
